x-coverage:
  state: covered
  reason: covered
  detail: >-
    Institution-operated surfaces were located and verified: the PHAIDRA repository platform, which the
    University of Vienna AUTHORS and hosts (Apache 2.0, github.com/phaidra) and for which this repo holds
    the full OpenAPI; a Shibboleth SAML identity provider registered in ACOnet and eduGAIN; an authenticated
    API gateway at api.univie.ac.at; and a live OAI-PMH endpoint on the institution's own host. Tenant
    relationships were recorded rather than credited as contracts: u:cris (Elsevier Pure), u:search (Ex
    Libris Primo) and u:ai (ACOmarket Academic AI). Two access limits qualify the reading but did not
    prevent it: phaidra.univie.ac.at is fronted by an Anubis proof-of-work bot challenge (live, not dead),
    and api.univie.ac.at rejects every unauthenticated request with a uniform JSON 400. One correction
    of ours: the host recorded for all 16 PHAIDRA surfaces in the June 2026 profile, services.phaidra.univie.ac.at,
    returns HTTP 200 with a zero-length body on every path INCLUDING nonsense paths - a Caddy catch-all
    soft-200 that a status-code-only probe would have graded live. Re-based to phaidra.univie.ac.at/api
    per re3data r3d100010472. No open data portal (data./opendata. univie.ac.at do not resolve), no institution
    GitHub organization (github.com/univie is an unrelated personal account), no llms.txt, and no public
    developer portal.
  evidence:
