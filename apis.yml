apis:
- aid: university-of-vienna:phaidra-oai-pmh
  name: PHAIDRA OAI-PMH Endpoint
  description: >-
    OAI-PMH metadata harvesting interface for the PHAIDRA repository, used by aggregators such as OpenAIRE,
    Europeana, BASE, OAPEN, EBSCO and Primo. Supports the oai_dc (Dublin Core) and oai_openaire metadata
    formats. Verified live returning a valid Identify response.
  humanURL: https://phaidra.org/docs/api/
  baseURL: https://services.phaidra.univie.ac.at/api/oai/
  tags:
  - OAI-PMH
  - Metadata
  - Harvesting
  - Repository
  - Dublin Core
  properties:
  - type: Documentation
    url: https://phaidra.org/docs/api/
- aid: university-of-vienna:hei-api
  name: HEI API (University of Vienna record)
  description: >-
    The pan-European Higher Education Institutions (HEI) API, operated by the European University Foundation,
    publishes structured institutional data for the University of Vienna in JSON:API format, including
    Erasmus codes, PIC, Erasmus Charter (ECHE) status and address. This is a third-party API exposing
    University of Vienna data, not operated by the university itself.
  humanURL: https://hei.api.uni-foundation.eu/about
  baseURL: https://hei.api.uni-foundation.eu/api/public/schac/univie.ac.at/hei
  tags:
  - JSON:API
  - Institutional Data
  - Erasmus
  - Third-Party
  properties:
  - type: Documentation
    url: https://hei.api.uni-foundation.eu/about
