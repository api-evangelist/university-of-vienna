x-attribution-notes:
- generated: '2026-08-30'
  pipeline: pipeline-university
  finding: shared-contract heuristic producer/consumer inversion
  detail: >-
    audit-university-contracts.py flagged 14 PHAIDRA specs as SHARED CONTRACT because the University of
    Padua ships the same titles. The flag is cohort-derived and host-independent, and it is correct that
    these titles describe a product. It is INVERTED for this repo: the product's author is this institution.
    Vienna built PHAIDRA, publishes it Apache 2.0 at github.com/phaidra, and Padua's Library System Technical
    and Scientific Committee agreed in February 2010 to use Vienna's platform. Verdict held at x-operator:
    institution. Padua's copy is the tenant deployment, not Vienna's.
