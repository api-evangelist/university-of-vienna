aid: university-of-vienna
name: University of Vienna
x-type: university
x-category: Public Research University
description: >-
  The University of Vienna (Universitat Wien), founded 1365, is Austria's largest university and a member
  of LERU. Its programmable footprint is unusual for a university in one specific way: Vienna does not
  merely deploy a repository platform, it AUTHORS one. PHAIDRA (Permanent Hosting, Archiving and Indexing
  of Digital Resources and Assets) is open-source Fedora-based software built and hosted by the university's
  Zentraler Informatikdienst and University Library, published under Apache 2.0 at github.com/phaidra,
  and deployed by 25+ institutions across Europe including Padua, Ca' Foscari and IUAV. The OpenAPI in
  this repository is therefore the institution's own engineering output, not a vendor's contract running
  under its name. Everything else is bought: u:cris (research information) is Elsevier Pure, u:search
  is Ex Libris Primo, and u:ai runs on the ACOmarket-operated Academic AI platform shared by 20+ Austrian
  universities - all recorded here as tenant relationships, not as Vienna's contracts. The university
  also operates a Shibboleth identity provider registered in the ACOnet federation and eduGAIN, and an
  authenticated API gateway at api.univie.ac.at. There is no central branded developer portal, no public
  API documentation site, and no official GitHub organization for the institution itself (github.com/univie
  is an unrelated personal account).
