apis:
- aid: university-of-vienna:phaidra-oai-pmh
  name: PHAIDRA OAI-PMH Endpoint
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for PHAIDRA, the University of Vienna's own institutional
    repository platform. Harvested by OpenAIRE, Europeana, BASE, OAPEN, EBSCO and Primo; supports oai_dc
    (Dublin Core) and oai_openaire. Re-based 2026-08-30: the previously recorded host services.phaidra.univie.ac.at
    now returns HTTP 200 with a zero-length body on EVERY path including nonsense ones (Caddy catch-all
    vhost, CNAME to phaidra.univie.ac.at) - a soft-200, not a live API. re3data r3d100010472 registers
    the current base as https://phaidra.univie.ac.at/api/oai/. That host is live but fronted by an Anubis
    proof-of-work bot challenge, which grades LIVE, not dead.
  humanURL: https://phaidra.org/docs/api/
  baseURL: https://phaidra.univie.ac.at/api/oai/
  tags:
  - OAI-PMH
  - Metadata
  - Harvesting
  - Repository
  - Dublin Core
  properties:
