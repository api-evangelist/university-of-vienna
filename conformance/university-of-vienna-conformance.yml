not_found_note: >-
  No in-contract or machine-readable evidence located for these on 2026-08-30.
  ORCID and Crossref are plausible via u:cris/Pure but the Pure API is a vendor
  contract and any conformance there is Elsevier's, not the institution's — it is
  deliberately NOT claimed here. Nothing is asserted from prose.
