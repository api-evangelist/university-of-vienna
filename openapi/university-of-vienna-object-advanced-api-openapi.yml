      - basicAuth: []
      responses:
        '200':
          description: object info
          content:
            application/json:
              schema: {}
  /object/{pid}/modify:
    post:
      summary: Modify object properties
      description: Modify the basic properties of an object (the parameters are all optional). Admin credentials are needed.
      tags:
      - object-advanced
      security:
      - basicAuth: []
      parameters:
      - in: path
        name: pid
        schema:
          type: string
          required: true
        description: object pid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                  - A
                  - I
                  - D
                  required: false
                  default: A
                  description: The state of the object can be changed toA (= Active), I (= Inactive), D (= Deleted)
                label:
                  type: string
                  required: false
                  description: some string (currently not used in PHAIDRA)
                ownerid:
                  type: string
                  required: false
                  description: owner's username
                logmessage:
                  type: string
                  required: false
                  description: log message, string
                lastmodifieddate:
                  type: string
                  required: false
                  description: a date in ISO format
      responses:
        '200':
          description: object modified
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        msg:
                          type: string
                        type:
                          type: string
                  pid:
                    type: string
                  status:
                    type: number
        '404':
          description: object has not been found
          content:
            application/json:
              schema:
                type: object
  /object/{pid}/id/add:
    post:
      summary: Add an identifier triple
      description: Add an identifier to the triples (as a relationship with the predicate 'http://purl.org/dc/terms/identifier'). It is then available in the triplestore, Dublin Core and index automatically, but will not be added to metadata. IDs added this way are usually added by PHAIDRA (for Handles), while the IDs in metadata are added and controlled by the user.
      tags:
      - object-advanced
      security:
      - basicAuth: []
      parameters:
      - in: path
        name: pid
        schema:
          type: string
          required: true
        description: the requested object id
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                hdl:
                  type: string
                  required: false
                  example: 11353/10.448537
                  description: 'the handle identifier '
                doi:
                  type: string
                  required: false
                  example: 10.5194/bg-11-1491-2014
                  description: the DOI identifier
                urn:
                  type: string
                  required: false
                  example: urn:nbn:at:at-ubw-30020.78240.320264-3
                  description: the URN identifier
      responses:
        '200':
          description: Identifyer added
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        msg:
                          type: string
                        type:
                          type: string
                  status:
                    type: string
        '404':
          description: Failed to fetch data
          content:
            application/json:
              schema:
                type: object
